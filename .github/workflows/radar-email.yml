name: Radar remoto por e-mail
on:
  schedule:
    # 08:00 Brasilia, segunda a sexta (UTC-3); GitHub pode atrasar ou omitir execucoes
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Enviar ou gerar prévia sem envio/alteração do histórico'
        type: choice
        required: true
        default: previa_novas
        options:
          - previa_novas
          - previa_demonstracao
          - enviar

permissions:
  contents: write

concurrency:
  group: radar-email
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verificar integridade do relatório e envio HTML
        run: python -m unittest radar_email.test_radar -v
      - name: Buscar oportunidades e enviar e-mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          RADAR_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.modo != 'enviar' }}
          PREVIEW_INCLUDE_SEEN: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'previa_demonstracao' }}
        run: python radar_email/radar.py
      - name: Disponibilizar prévia para download
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo != 'enviar' }}
        uses: actions/upload-artifact@v4
        with:
          name: previa-radar
          path: |
            radar_email/previa_radar.txt
            radar_email/previa_radar.html
            radar_email/radar_interativo.html
          if-no-files-found: error
          retention-days: 7
      - name: Disponibilizar relatorio interativo apos envio
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.modo == 'enviar') }}
        uses: actions/upload-artifact@v4
        with:
          name: radar-interativo
          path: radar_email/radar_interativo.html
          if-no-files-found: error
          retention-days: 7
      - name: Salvar controle de vagas enviadas
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.modo == 'enviar') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_email/vistos.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualiza histórico do radar por e-mail [skip ci]"
            # O repositório pode receber commits enquanto o radar consulta fontes.
            # Não force push: preserve alterações externas e tente rebase seguro.
            for tentativa in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::error::Conflito ao atualizar o histórico: intervenção necessária."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Histórico publicado."
                exit 0
              fi
              echo "Repositório alterado durante o push. Tentativa ${tentativa}/3."
              sleep 3
            done
            echo "::error::Não foi possível publicar o histórico após 3 tentativas."
            exit 1
          fi
