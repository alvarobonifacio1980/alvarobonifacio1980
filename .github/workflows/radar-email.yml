name: Radar remoto por e-mail
on:
  schedule:
    # 08:00 no Brasil (America/Sao_Paulo = UTC-3)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-email
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Buscar oportunidades e enviar e-mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python radar_email/radar.py
      - name: Salvar controle de vagas enviadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_email/vistos.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualiza histórico do radar por e-mail [skip ci]"
            # O repositório pode receber commits enquanto o radar consulta fontes.
            # Não force push: preserve alterações externas e tente rebase seguro.
            for tentativa in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::error::Conflito ao atualizar o histórico: intervenção necessária."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Histórico publicado."
                exit 0
              fi
              echo "Repositório alterado durante o push. Tentativa ${tentativa}/3."
              sleep 3
            done
            echo "::error::Não foi possível publicar o histórico após 3 tentativas."
            exit 1
          fi
