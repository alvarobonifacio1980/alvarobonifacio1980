name: Capturas reais dos aplicativos
on:
  push:
    paths:
      - .github/workflows/capturar-apps.yml
      - tools/capturar_apps.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Capturar interfaces reais do Render
        run: python tools/capturar_apps.py
      - name: Publicar capturas no repositório
        run: |
          if [ -z "$(find assets/screenshots -maxdepth 1 -type f -name '*.png' -print -quit)" ]; then
            echo "Nenhuma captura válida foi produzida"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: capturas reais dos aplicativos [skip ci]"
            git push
          fi
