name: Validar código do radar e-mail
on:
  push:
    paths:
      - 'radar_email/*.py'
      - '.github/workflows/validar-radar-email.yml'
  pull_request:
    paths:
      - 'radar_email/*.py'
      - '.github/workflows/validar-radar-email.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compilar Python sem instalar dependências
        run: python -m py_compile radar_email/radar.py
